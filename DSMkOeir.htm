<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐺 گرگ در جنگل | ۵ انیمیشن + کنترل لمسی</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-touch-callout: none; }
    body { overflow: hidden; background: #0d1b2a; font-family: Arial, sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; }

    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 16px; background: rgba(0,0,0,0.8);
      padding: 20px 30px; border-radius: 12px; text-align: center; z-index: 20;
    }
    #loading .spinner {
      display: inline-block; width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ff6b35;
      border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 10px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #info {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
      color: #fff; background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 20px;
      font-size: 12px; z-index: 10; backdrop-filter: blur(5px); pointer-events: none; white-space: nowrap;
    }
    #info span { color: #ffb347; font-weight: bold; }

    #status {
      position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%);
      color: #88ddff; background: rgba(0,0,0,0.6); padding: 4px 14px; border-radius: 20px;
      font-size: 11px; z-index: 10; backdrop-filter: blur(5px); pointer-events: none; display: none;
    }

    #test-status {
      position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
      color: #ffdd44; background: rgba(0,0,0,0.7); padding: 6px 18px; border-radius: 20px;
      font-size: 13px; z-index: 10; backdrop-filter: blur(5px); pointer-events: none;
      border: 1px solid rgba(255,220,68,0.3); display: none; white-space: nowrap;
    }

    #touch-controls {
      position: absolute; bottom: 30px; left: 0; right: 0; display: flex;
      justify-content: space-between; padding: 0 15px; z-index: 10; pointer-events: none;
      touch-action: none; opacity: 0; transition: opacity 0.5s;
    }
    #touch-controls.active { opacity: 1; }

    #joystick-area { width: 120px; height: 120px; pointer-events: auto; touch-action: none; }
    #joystick-base {
      width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.15);
      border: 2px solid rgba(255,255,255,0.2); backdrop-filter: blur(5px); position: relative; touch-action: none;
    }
    #joystick-knob {
      width: 45px; height: 45px; border-radius: 50%; background: rgba(255,255,255,0.3);
      border: 2px solid rgba(255,255,255,0.4); position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%); pointer-events: none; touch-action: none;
      box-shadow: 0 0 20px rgba(255,107,53,0.2);
    }

    #action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; pointer-events: auto; touch-action: none; }
    .action-btn {
      width: 56px; height: 56px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1); backdrop-filter: blur(5px); color: #fff; font-size: 10px;
      font-weight: bold; display: flex; align-items: center; justify-content: center; touch-action: none;
      transition: all 0.1s; text-shadow: 0 0 10px rgba(0,0,0,0.5); text-align: center; line-height: 1.2;
    }
    .action-btn:active, .action-btn.active { background: rgba(255,107,53,0.4); border-color: #ff6b35; transform: scale(0.9); }

    #run-btn { background: rgba(255,200,50,0.2); border-color: rgba(255,200,50,0.4); }
    #sit-btn { background: rgba(50,200,255,0.2); border-color: rgba(50,200,255,0.4); }
    #creep-btn { background: rgba(100,200,100,0.2); border-color: rgba(100,200,100,0.4); }
    #idle-btn { background: rgba(200,150,255,0.2); border-color: rgba(200,150,255,0.4); }

    #hint {
      position: absolute; bottom: 190px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.35); font-size: 10px; z-index: 10; background: rgba(0,0,0,0.4);
      padding: 4px 12px; border-radius: 12px; backdrop-filter: blur(5px); pointer-events: none;
      white-space: nowrap; display: none;
    }

    @media (max-width: 500px) {
      #joystick-area { width: 90px; height: 90px; }
      #joystick-knob { width: 35px; height: 35px; }
      .action-btn { width: 44px; height: 44px; font-size: 8px; }
      #info { font-size: 10px; padding: 4px 12px; top: 10px; }
      #test-status { font-size: 11px; top: 60px; }
      #action-buttons { gap: 6px; }
    }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div>⏳ در حال ساختن جنگل و بارگذاری گرگ...</div>
  <div style="font-size:12px; margin-top:8px; opacity:0.6;" id="progress-text">لطفاً صبر کنید...</div>
</div>

<div id="info">🐺 <span>گرگ</span> | جنگل واقعی + ۵ انیمیشن</div>
<div id="test-status">🎬 در حال تست انیمیشن‌ها...</div>
<div id="status">🐺 آماده حرکت...</div>
<div id="hint">🎮 جویاستیک · ۴ دکمه اکشن</div>

<div id="touch-controls">
  <div id="joystick-area">
    <div id="joystick-base"><div id="joystick-knob"></div></div>
  </div>
  <div id="action-buttons">
    <div id="run-btn" class="action-btn">🏃<br>دویدن</div>
    <div id="sit-btn" class="action-btn">🐕<br>نشستن</div>
    <div id="creep-btn" class="action-btn">🐾<br>خزیدن</div>
    <div id="idle-btn" class="action-btn">🧍<br>ایستادن</div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const isMobile = window.innerWidth < 768;

// ============================================================
// صحنه، دوربین، رندر
// ============================================================
const scene = new THREE.Scene();

// آسمون گرادیانت واقعی (بجای رنگ تخت)
function makeSkyGradient(){
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0,0,0,256);
  grad.addColorStop(0, '#3a6ea5');
  grad.addColorStop(0.45, '#8fc1e3');
  grad.addColorStop(0.75, '#dff0e0');
  grad.addColorStop(1, '#eef7e6');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,2,256);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
scene.background = makeSkyGradient();
scene.fog = new THREE.Fog(0xbcd8c9, 18, 75);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(5, 3, 8);

const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.8, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2.5;
controls.maxDistance = 22;
controls.maxPolarAngle = Math.PI / 2.15;
controls.update();

// ============================================================
// نورپردازی واقعی (نور خورشید + آسمون + پرکننده)
// ============================================================
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x3a3020, 0.9);
scene.add(hemi);

const sunLight = new THREE.DirectionalLight(0xfff1d6, 2.0);
sunLight.position.set(15, 22, 10);
sunLight.castShadow = true;
sunLight.shadow.mapSize.width = 2048;
sunLight.shadow.mapSize.height = 2048;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 60;
sunLight.shadow.camera.left = -20;
sunLight.shadow.camera.right = 20;
sunLight.shadow.camera.top = 20;
sunLight.shadow.camera.bottom = -20;
sunLight.shadow.bias = -0.0015;
scene.add(sunLight);

const fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
fillLight.position.set(-10, 6, -8);
scene.add(fillLight);

// ============================================================
// زمینِ واقعی (چمن با بافت رویه‌ای) — پاهای گرگ دقیقاً روی این می‌ایستند
// ============================================================
const GROUND_Y = 0;

function makeGrassTexture(){
  const size = 512;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#4c7a3d';
  ctx.fillRect(0,0,size,size);
  for(let i=0;i<9000;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const shade = 30 + Math.random()*60;
    const g = 90 + Math.random()*60;
    ctx.fillStyle = `rgba(${40+Math.random()*30},${g},${30+Math.random()*30},0.5)`;
    ctx.fillRect(x, y, 2+Math.random()*2, 2+Math.random()*2);
  }
  // چند لکه تیره‌تر برای عمق
  for(let i=0;i<40;i++){
    ctx.fillStyle = 'rgba(30,50,20,0.15)';
    ctx.beginPath();
    ctx.arc(Math.random()*size, Math.random()*size, 15+Math.random()*35, 0, Math.PI*2);
    ctx.fill();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(24, 24);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

const groundGeo = new THREE.PlaneGeometry(160, 160, 64, 64);
// موج ملایم زمین (طبیعی‌تر از سطح کاملا صاف) با محدود کردن نزدیک مرکز برای صافی زیر پای گرگ
const posAttr = groundGeo.attributes.position;
for(let i=0;i<posAttr.count;i++){
  const x = posAttr.getX(i), y = posAttr.getY(i);
  const distFromCenter = Math.sqrt(x*x+y*y);
  const falloff = Math.min(1, Math.max(0, (distFromCenter-6)/20));
  const h = (Math.sin(x*0.15)+Math.cos(y*0.17))*0.35*falloff;
  posAttr.setZ(i, h);
}
groundGeo.computeVertexNormals();

const groundMat = new THREE.MeshStandardMaterial({ map: makeGrassTexture(), roughness: 0.95, metalness: 0.0 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI/2;
ground.position.y = GROUND_Y;
ground.receiveShadow = true;
scene.add(ground);

// مسیر خاکی دور گرگ
const pathMat = new THREE.MeshStandardMaterial({ color:0x8a6d4b, roughness:1 });
const path = new THREE.Mesh(new THREE.RingGeometry(2.4, 3.1, 48), pathMat);
path.rotation.x = -Math.PI/2;
path.position.y = GROUND_Y + 0.003;
path.receiveShadow = true;
scene.add(path);

// ============================================================
// درخت‌ها، بوته‌ها، سنگ‌ها (پروسیجرال — بدون فایل خارجی)
// ============================================================
function makeTree(x, z, scale=1){
  const g = new THREE.Group();
  const trunkMat = new THREE.MeshStandardMaterial({ color:0x5b3d2b, roughness:0.95 });
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.12*scale, 0.18*scale, 1.6*scale, 8), trunkMat);
  trunk.position.y = 0.8*scale;
  trunk.castShadow = true;
  g.add(trunk);

  const leafColors = [0x2f6b3a, 0x3a7d45, 0x27552f];
  for(let i=0;i<3;i++){
    const leafMat = new THREE.MeshStandardMaterial({ color: leafColors[i%leafColors.length], roughness:0.9 });
    const leaf = new THREE.Mesh(new THREE.ConeGeometry((1.1-i*0.18)*scale, 1.3*scale, 8), leafMat);
    leaf.position.y = (1.6 + i*0.75)*scale;
    leaf.castShadow = true;
    leaf.receiveShadow = true;
    g.add(leaf);
  }
  g.position.set(x, GROUND_Y, z);
  g.rotation.y = Math.random()*Math.PI*2;
  return g;
}

function makeBush(x,z,scale=1){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x3d6b34, roughness:0.95 });
  for(let i=0;i<4;i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(0.32*scale, 8, 8), mat);
    s.position.set((Math.random()-0.5)*0.4*scale, 0.25*scale + Math.random()*0.1, (Math.random()-0.5)*0.4*scale);
    s.castShadow = true; s.receiveShadow = true;
    g.add(s);
  }
  g.position.set(x, GROUND_Y, z);
  return g;
}

function makeRock(x,z,scale=1){
  const mat = new THREE.MeshStandardMaterial({ color:0x8a8a86, roughness:0.9, flatShading:true });
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.35*scale, 0), mat);
  rock.position.set(x, GROUND_Y + 0.15*scale, z);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true; rock.receiveShadow = true;
  return rock;
}

const forestGroup = new THREE.Group();
const placed = [];
function farEnough(x,z,min){
  return placed.every(p => Math.hypot(p.x-x, p.z-z) > min);
}
// حلقه‌ای از درخت‌ها دور فضای بازی، با فاصله امن از مرکز
for(let i=0;i<26;i++){
  const angle = (i/26)*Math.PI*2 + Math.random()*0.15;
  const radius = 7 + Math.random()*10;
  const x = Math.cos(angle)*radius;
  const z = Math.sin(angle)*radius;
  if(!farEnough(x,z,1.6)) continue;
  placed.push({x,z});
  forestGroup.add(makeTree(x,z, 0.85+Math.random()*0.7));
}
for(let i=0;i<18;i++){
  const angle = Math.random()*Math.PI*2;
  const radius = 4.5 + Math.random()*12;
  const x = Math.cos(angle)*radius;
  const z = Math.sin(angle)*radius;
  if(!farEnough(x,z,1.0)) continue;
  placed.push({x,z});
  forestGroup.add(makeBush(x,z, 0.6+Math.random()*0.6));
}
for(let i=0;i<12;i++){
  const angle = Math.random()*Math.PI*2;
  const radius = 3.5 + Math.random()*13;
  const x = Math.cos(angle)*radius;
  const z = Math.sin(angle)*radius;
  if(!farEnough(x,z,1.0)) continue;
  placed.push({x,z});
  forestGroup.add(makeRock(x,z, 0.5+Math.random()*0.9));
}
scene.add(forestGroup);

// کوه‌های دور دست برای عمق بصری
function makeMountainRing(){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x7d93a8, roughness:1, flatShading:true });
  const count = 14;
  for(let i=0;i<count;i++){
    const angle = (i/count)*Math.PI*2;
    const radius = 55 + Math.random()*10;
    const h = 12 + Math.random()*14;
    const m = new THREE.Mesh(new THREE.ConeGeometry(10+Math.random()*6, h, 5), mat);
    m.position.set(Math.cos(angle)*radius, h/2 - 2, Math.sin(angle)*radius);
    m.rotation.y = Math.random()*Math.PI;
    g.add(m);
  }
  return g;
}
scene.add(makeMountainRing());

// چند تکه ابر ساده
function makeCloud(x,y,z,scale=1){
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:0.85 });
  for(let i=0;i<5;i++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(1.2*scale,8,8), mat);
    s.position.set((Math.random()-0.5)*3*scale, (Math.random()-0.5)*0.6*scale, (Math.random()-0.5)*1.5*scale);
    g.add(s);
  }
  g.position.set(x,y,z);
  return g;
}
const cloudGroup = new THREE.Group();
for(let i=0;i<8;i++){
  cloudGroup.add(makeCloud((Math.random()-0.5)*90, 18+Math.random()*8, (Math.random()-0.5)*90, 1.5+Math.random()*2));
}
scene.add(cloudGroup);

// ============================================================
// متغیرهای گرگ / انیمیشن
// ============================================================
let mixer = null;
let animations = {};
let currentAction = null;
let model = null;
const clock = new THREE.Clock();
let isModelLoaded = false;

let moveX = 0;
let moveZ = 0;
let isRunning = false;
let isSitting = false;
let isCreeping = false;
let isIdle = false;
let isMoving = false;
const speed = 0.065;

let isTesting = false;
let testAnimations = [];
let testIndex = 0;
let testTimer = null;
let isUserControlActive = false;

function logMessage(msg) {
  console.log(msg);
  const statusDiv = document.getElementById('status');
  statusDiv.textContent = msg;
  statusDiv.style.color = '#88ddff';
  statusDiv.style.display = 'block';
  setTimeout(() => { statusDiv.style.display = 'none'; }, 2000);
}
function updateTestStatus(text) {
  const testDiv = document.getElementById('test-status');
  testDiv.textContent = text;
  testDiv.style.display = 'block';
}

const loadingDiv = document.getElementById('loading');
const progressText = document.getElementById('progress-text');
let loadTimeout;

loadTimeout = setTimeout(() => {
  loadingDiv.innerHTML = `
    <div style="color:#ff6b35;">⏱️ بارگذاری طولانی شد...</div>
    <button onclick="location.reload()" style="margin-top:12px; padding:8px 20px; background:#ff6b35; border:none; border-radius:8px; color:#fff; font-size:14px; cursor:pointer;">
      🔄 دوباره تلاش کن
    </button>`;
}, 20000);

const loader = new GLTFLoader();

// یک "کف سایه" نرم زیر پای گرگ برای اتصال بصری بهتر به زمین
const contactShadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.1, 24),
  new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.28, depthWrite:false })
);
contactShadow.rotation.x = -Math.PI/2;
contactShadow.position.y = GROUND_Y + 0.01;
scene.add(contactShadow);

loader.load(
  'https://cdn.jsdelivr.net/gh/s0379265-netizen/Fagah@main/wolf_with_animations.glb',
  (gltf) => {
    clearTimeout(loadTimeout);
    model = gltf.scene;

    model.scale.set(0.8, 0.8, 0.8);

    // پاهای گرگ را دقیقا روی زمین بگذار (نه شناور)
    const box = new THREE.Box3().setFromObject(model);
    const feetOffset = -box.min.y; // فاصله پایین‌ترین نقطه مدل تا مرکز محلی
    model.position.set(0, GROUND_Y + feetOffset, 0);
    model.userData.groundOffset = feetOffset;

    model.traverse((node) => {
      if (node.isMesh) {
        node.castShadow = true;
        node.receiveShadow = true;
      }
    });

    scene.add(model);
    loadingDiv.style.display = 'none';
    isModelLoaded = true;

    mixer = new THREE.AnimationMixer(model);
    const clips = gltf.animations || [];

    if (clips.length === 0) {
      logMessage('❌ هیچ انیمیشنی پیدا نشد!');
      return;
    }

    clips.forEach((clip) => {
      const name = clip.name || 'بی‌نام';
      animations[name] = clip;
      console.log(`  - "${name}" (${clip.duration.toFixed(2)} ثانیه)`);
    });

    startAutoTest();
  },
  (progress) => {
    if (progress.total > 0) {
      const percent = Math.round((progress.loaded / progress.total) * 100);
      progressText.textContent = `${percent}% (${Math.round(progress.loaded / 1024)}/${Math.round(progress.total / 1024)} KB)`;
    }
  },
  (error) => {
    clearTimeout(loadTimeout);
    console.error('❌ خطا:', error);
    loadingDiv.innerHTML = `
      <div style="color:#ff6b6b;">❌ بارگذاری ناموفق</div>
      <button onclick="location.reload()" style="margin-top:12px; padding:8px 20px; background:#ff6b35; border:none; border-radius:8px; color:#fff; font-size:14px; cursor:pointer;">
        🔄 دوباره تلاش کن
      </button>`;
  }
);

function playAnimation(name, fadeIn = 0.3) {
  if (!mixer || !animations[name] || !model || !isModelLoaded) return;
  if (currentAction && currentAction.getClip && currentAction.getClip().name === name) return;
  if (currentAction) currentAction.fadeOut(fadeIn);
  const action = mixer.clipAction(animations[name]);
  action.reset();
  action.fadeIn(fadeIn);
  action.play();
  currentAction = action;
}

function startAutoTest() {
  isTesting = true;
  testAnimations = ['01_Run', '02_walk', '03_creep', '05_site', '04_Idle'];
  testIndex = 0;

  document.getElementById('touch-controls').classList.remove('active');
  document.getElementById('hint').style.display = 'none';

  updateTestStatus(`🎬 تست ${testAnimations[testIndex]}`);
  playAnimation(testAnimations[testIndex]);

  testTimer = setInterval(() => {
    testIndex++;
    if (testIndex >= testAnimations.length) {
      clearInterval(testTimer);
      isTesting = false;
      updateTestStatus('✅ تست کامل شد! کنترل را به دست بگیرید');

      document.getElementById('touch-controls').classList.add('active');
      document.getElementById('hint').style.display = 'block';

      setTimeout(() => {
        playAnimation('04_Idle');
        document.getElementById('test-status').style.display = 'none';
        isUserControlActive = true;
      }, 2000);
      return;
    }
    updateTestStatus(`🎬 تست ${testAnimations[testIndex]}`);
    playAnimation(testAnimations[testIndex]);
  }, 2500);
}

function groundHeightAt(x, z){
  // منطبق با موج‌های procedural زمین (falloff نزدیک مرکز صفر است)
  const distFromCenter = Math.sqrt(x*x+z*z);
  const falloff = Math.min(1, Math.max(0, (distFromCenter-6)/20));
  return GROUND_Y + (Math.sin(x*0.15)+Math.cos(z*0.17))*0.35*falloff;
}

function updateMovement(delta) {
  if (!model || !isModelLoaded || !isUserControlActive) return;

  const moveLen = Math.sqrt(moveX * moveX + moveZ * moveZ);
  const isMovingNow = moveLen > 0.05;

  if (isSitting) { playAnimation('05_site'); isMoving = false; }
  else if (isIdle) { playAnimation('04_Idle'); isMoving = false; }
  else if (isCreeping && !isMovingNow) { playAnimation('03_creep'); isMoving = false; }
  else if (isMovingNow && !isSitting && !isIdle) {
    const forward = new THREE.Vector3(0, 0, -1);
    forward.applyQuaternion(model.quaternion);
    const right = new THREE.Vector3(1, 0, 0);
    right.applyQuaternion(model.quaternion);

    const moveVec = new THREE.Vector3();
    moveVec.addScaledVector(forward, -moveZ);
    moveVec.addScaledVector(right, moveX);
    moveVec.normalize().multiplyScalar(speed * (isRunning ? 2.5 : 1));

    model.position.x += moveVec.x;
    model.position.z += moveVec.z;
    // محدوده‌ی زمین
    const R = 55;
    const dist = Math.hypot(model.position.x, model.position.z);
    if(dist > R){
      model.position.x *= R/dist;
      model.position.z *= R/dist;
    }

    if (moveLen > 0.1) {
      const targetAngle = Math.atan2(-moveX, -moveZ);
      let currentAngle = model.rotation.y;
      let diff = targetAngle - currentAngle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      model.rotation.y += diff * 0.08;
    }

    if (isRunning) playAnimation('01_Run');
    else if (isCreeping) playAnimation('03_creep');
    else playAnimation('02_walk');

    isMoving = true;
  } else if (!isSitting && !isIdle && !isCreeping) {
    if (isMoving || !currentAction || (currentAction.getClip && currentAction.getClip().name !== '04_Idle')) {
      playAnimation('04_Idle');
      isMoving = false;
    }
  }

  // پاهای گرگ همیشه دقیقا روی سطح واقعی زمین (بدون شناور بودن)
  const groundOffset = model.userData.groundOffset || 0;
  const targetY = groundHeightAt(model.position.x, model.position.z) + groundOffset;
  model.position.y += (targetY - model.position.y) * 0.25;

  // خم شدن ملایم بدن گرگ هم‌راستا با شیب زمین (احساس واقعی‌تر تماس با خاک)
  const slopeX = groundHeightAt(model.position.x+0.3, model.position.z) - groundHeightAt(model.position.x-0.3, model.position.z);
  const slopeZ = groundHeightAt(model.position.x, model.position.z+0.3) - groundHeightAt(model.position.x, model.position.z-0.3);
  model.rotation.z += (-slopeX*0.3 - model.rotation.z) * 0.1;
  model.rotation.x += (slopeZ*0.3 - model.rotation.x) * 0.1;

  contactShadow.position.set(model.position.x, groundHeightAt(model.position.x, model.position.z) + 0.01, model.position.z);

  controls.target.lerp(new THREE.Vector3(model.position.x, model.position.y+0.6, model.position.z), 0.05);
}

// ============================================================
// جویاستیک
// ============================================================
const joystickBase = document.getElementById('joystick-base');
const joystickKnob = document.getElementById('joystick-knob');
const joystickArea = document.getElementById('joystick-area');

let joystickActive = false;
let joystickTouchId = null;

function handleJoystickStart(clientX, clientY) {
  joystickActive = true;
  const rect = joystickBase.getBoundingClientRect();
  updateJoystick(clientX - (rect.left+rect.width/2), clientY - (rect.top+rect.height/2));
}
function handleJoystickMove(clientX, clientY) {
  if (!joystickActive) return;
  const rect = joystickBase.getBoundingClientRect();
  updateJoystick(clientX - (rect.left+rect.width/2), clientY - (rect.top+rect.height/2));
}
function updateJoystick(dx, dy) {
  const maxDist = 40;
  const dist = Math.sqrt(dx*dx+dy*dy);
  const clampedDist = Math.min(dist, maxDist);
  const angle = Math.atan2(dy, dx);
  const x = Math.cos(angle)*clampedDist, y = Math.sin(angle)*clampedDist;
  joystickKnob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  moveX = Math.max(-1, Math.min(1, x/maxDist));
  moveZ = Math.max(-1, Math.min(1, y/maxDist));
}
function resetJoystick() {
  joystickActive = false;
  joystickKnob.style.transform = 'translate(-50%, -50%)';
  moveX = 0; moveZ = 0;
}

joystickArea.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.changedTouches[0];
  joystickTouchId = touch.identifier;
  handleJoystickStart(touch.clientX, touch.clientY);
});
document.addEventListener('touchmove', (e) => {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) { e.preventDefault(); handleJoystickMove(touch.clientX, touch.clientY); }
  }
}, { passive: false });
document.addEventListener('touchend', (e) => {
  for (const touch of e.changedTouches) {
    if (touch.identifier === joystickTouchId) { resetJoystick(); joystickTouchId = null; }
  }
});
// موس هم برای دسکتاپ (تست جویاستیک)
let mouseJoystickDown = false;
joystickArea.addEventListener('mousedown', (e)=>{ mouseJoystickDown=true; handleJoystickStart(e.clientX, e.clientY); });
document.addEventListener('mousemove', (e)=>{ if(mouseJoystickDown) handleJoystickMove(e.clientX, e.clientY); });
document.addEventListener('mouseup', ()=>{ if(mouseJoystickDown){ mouseJoystickDown=false; resetJoystick(); } });

// ============================================================
// دکمه‌های اکشن
// ============================================================
const runBtn = document.getElementById('run-btn');
const sitBtn = document.getElementById('sit-btn');
const creepBtn = document.getElementById('creep-btn');
const idleBtn = document.getElementById('idle-btn');

function clearActiveBtns(except){
  [runBtn,sitBtn,creepBtn,idleBtn].forEach(b=>{ if(b!==except) b.classList.remove('active'); });
}

function bindPressHold(btn, onDown, onUp){
  btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); onDown(); });
  btn.addEventListener('touchend', (e)=>{ e.preventDefault(); onUp(); });
  btn.addEventListener('mousedown', onDown);
  btn.addEventListener('mouseup', onUp);
}
bindPressHold(runBtn,
  ()=>{ if(!isUserControlActive) return; isSitting=false; isIdle=false; isCreeping=false; isRunning=true; runBtn.classList.add('active'); clearActiveBtns(runBtn); logMessage('🏃 دویدن'); },
  ()=>{ isRunning=false; runBtn.classList.remove('active'); }
);

function bindToggle(btn, setter, offMsg, onMsg){
  const handler = ()=>{
    if(!isUserControlActive) return;
    const newState = !setter.get();
    setter.set(newState);
    btn.classList.toggle('active', newState);
    clearActiveBtns(btn);
    logMessage(newState ? onMsg : offMsg);
  };
  btn.addEventListener('touchstart', (e)=>{ e.preventDefault(); handler(); });
  btn.addEventListener('mousedown', handler);
}
bindToggle(sitBtn, { get:()=>isSitting, set:(v)=>{ isSitting=v; if(v){isRunning=false;isIdle=false;isCreeping=false;} } }, '🐺 ایستادن', '🐕 نشستن');
bindToggle(creepBtn, { get:()=>isCreeping, set:(v)=>{ isCreeping=v; if(v){isRunning=false;isSitting=false;isIdle=false;} } }, '🐺 ایستادن', '🐾 خزیدن');
bindToggle(idleBtn, { get:()=>isIdle, set:(v)=>{ isIdle=v; if(v){isRunning=false;isSitting=false;isCreeping=false;} } }, '🐺 حرکت آزاد', '🧍 ایستادن');

// ============================================================
// حلقه اصلی
// ============================================================
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  if (mixer) mixer.update(delta);
  updateMovement(delta);

  // حرکت آروم ابرها برای حس زنده بودن محیط
  cloudGroup.children.forEach((c,i)=>{ c.position.x += Math.sin(clock.elapsedTime*0.05+i)*0.003; });

  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('%c🐺 گرگ در جنگل واقعی — ۵ انیمیشن + کنترل کامل', 'font-size: 16px; font-weight: bold;');
