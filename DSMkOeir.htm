<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Neo Messenger</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="https://api.backendless.com/sdk/js/latest/backendless.min.js"></script>
  <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
  <style>
    /* ... [تمام استایل‌های قبلی ثابت می‌مانند] ... */
    :root {
      --bg: #0b0e11;
      --surface: #151a21;
      --surface2: #1c232d;
      --surface3: #252e3a;
      --primary: #3b82f6;
      --primary2: #2563eb;
      --accent: #22d3ee;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f59e0b;
      --border: rgba(255,255,255,0.07);
      --bubble-out: linear-gradient(135deg, #2563eb, #3b82f6);
      --bubble-in: #1e293b;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body {
      font-family:'Vazirmatn', system-ui, sans-serif;
      background:#000; color:var(--text);
      height:100dvh; overflow:hidden;
    }
    .app {
      max-width:480px; height:100dvh; margin:0 auto;
      background:var(--bg); position:relative; overflow:hidden;
      display:flex; flex-direction:column;
    }
    /* ... [سایر استایل‌ها یکسان] ... */
    .screen {
      position:absolute; inset:0; display:flex; flex-direction:column;
      background:var(--bg);
      transition: transform .32s cubic-bezier(.32,.72,0,1), opacity .32s;
    }
    .screen.hide { transform:translateX(110%); pointer-events:none; }
    .screen.hide-back { transform:translateX(-25%); opacity:.45; pointer-events:none; }
    /* ===== SPLASH ===== */
    #splashScreen {
      position:absolute; inset:0; z-index:999;
      background:var(--bg); display:flex;
      flex-direction:column; align-items:center; justify-content:center;
      gap:18px;
    }
    #splashScreen .mark {
      width:80px; height:80px; border-radius:24px;
      background:linear-gradient(135deg,#3b82f6,#22d3ee);
      display:flex; align-items:center; justify-content:center;
      font-size:36px; font-weight:800; color:#fff;
      box-shadow:0 12px 30px rgba(59,130,246,.4);
      animation:pulse 2s infinite;
    }
    @keyframes pulse {
      0%,100% { transform:scale(1); }
      50% { transform:scale(1.05); }
    }
    #splashScreen h1 { font-size:24px; font-weight:800; letter-spacing:-.5px; }
    #splashScreen .loader {
      width:30px; height:30px; border:3px solid rgba(255,255,255,.1);
      border-top-color:var(--primary); border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* ... [سایر استایل‌ها] ... */
    .group-badge {
      background:var(--primary); color:#fff; font-size:11px;
      padding:2px 10px; border-radius:12px; margin-right:8px;
    }
    .group-avatar {
      width:52px; height:52px; border-radius:50%;
      background:linear-gradient(135deg,#3b82f6,#22d3ee);
      display:flex; align-items:center; justify-content:center;
      font-size:24px; font-weight:800; color:#fff;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- SPLASH SCREEN -->
    <div id="splashScreen">
      <div class="mark">N</div>
      <h1>Neo Messenger</h1>
      <div class="loader"></div>
      <p style="color:var(--muted); font-size:13px">در حال بارگذاری...</p>
    </div>

    <!-- AUTH (با همان محتوا) -->
    <div class="screen hide" id="authScreen">...</div>

    <!-- COMPLETE PROFILE (با همان محتوا) -->
    <div class="screen hide" id="completeScreen">...</div>

    <!-- MAIN (با افزودن گروه) -->
    <div class="screen hide" id="mainScreen">
      <div class="header">
        <div class="header-title">پیام‌ها</div>
        <div style="display:flex; gap:8px">
          <button class="icon-btn" id="btnRefresh"><i class="fa-solid fa-rotate"></i></button>
          <button class="icon-btn" id="btnMyProfile"><i class="fa-solid fa-user"></i></button>
        </div>
      </div>
      <div class="search-bar">
        <div class="search-inner">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="جستجو..." />
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" data-tab="chats">چت‌ها</button>
        <button class="tab" data-tab="users">کاربران</button>
        <button class="tab" data-tab="groups">گروه‌ها</button>
      </div>
      <div class="list" id="chatList"></div>
      <div class="list" id="userList" style="display:none"></div>
      <div class="list" id="groupList" style="display:none"></div>
      <div class="me-bar" id="meBar">
        <img class="avatar" id="meAvatar" src="" alt="" />
        <div class="me-info">
          <div class="me-name" id="meName">—</div>
          <div class="me-sub" id="meSub">—</div>
        </div>
        <i class="fa-solid fa-chevron-left" style="color:var(--muted); font-size:13px"></i>
      </div>
    </div>

    <!-- CHAT ROOM (با همان محتوا) -->
    <div class="screen hide" id="chatScreen">...</div>

    <!-- PROFILE VIEW (با همان محتوا) -->
    <div class="screen hide" id="profileScreen">...</div>

    <!-- SETTINGS (با همان محتوا) -->
    <div class="screen hide" id="settingsScreen">...</div>

    <!-- CHAT MENU (با همان محتوا) -->
    <div class="menu-sheet" id="chatMenu">...</div>

    <div class="loading-overlay" id="loading"><div class="spinner"></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <script>
    // ===================== CONFIG =====================
    const CONFIG = {
      APP_ID: 'C50651A5-1DFC-4BA1-AA34-B4444E9AC5A5',
      API_KEY: '9303E7E8-BAF9-4023-A34B-E4E024192785',
      ABLY_KEY: 'NNYzzQ.7HHPYg:NA1mSMcWdEnlWOHGZ4CaF7ZUkoXe1Iggtf0sy-nNsDM'
    };

    // ===================== STATE =====================
    let currentUser = null;
    let ably = null;
    let presenceChannel = null;
    let activeChatChannel = null;
    let currentPeer = null;
    let allUsers = [];
    let conversations = [];
    let onlineUsers = new Set();
    let soundEnabled = true;
    let mutedChats = new Set(JSON.parse(localStorage.getItem('neo_muted') || '[]'));
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let recTimer = null;
    let recordingStart = 0;

    // ===== GROUP CONSTANTS =====
    const GROUP_ID = 'team_developer_group';
    const GROUP_NAME = 'تیم توسعه دهنده پیام رسان';
    const GROUP_AVATAR = 'https://cdn.imgurl.ir/uploads/j30850_InShot_20260829_114222431.png';

    // ===================== INIT BACKENDLESS =====================
    Backendless.serverURL = 'https://api.backendless.com';
    Backendless.initApp(CONFIG.APP_ID, CONFIG.API_KEY);

    // ===================== HELPERS =====================
    function normalizeEmail(email) {
      return (email || '').replace(/\s+/g, '').trim().toLowerCase();
    }
    function normalizeUsername(u) {
      return (u || '').replace(/\s+/g, '_').trim().toLowerCase().replace(/[^a-z0-9._]/g, '');
    }
    function showToast(text) {
      const t = document.getElementById('toast');
      t.textContent = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2600);
    }
    function setLoading(v) {
      document.getElementById('loading').classList.toggle('show', v);
    }
    function showScreen(id) {
      ['authScreen','completeScreen','mainScreen','chatScreen','profileScreen','settingsScreen'].forEach(s => {
        const el = document.getElementById(s);
        if (s === id) el.classList.remove('hide', 'hide-back');
        else el.classList.add('hide');
      });
    }
    function avatarUrl(seed) {
      return 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + encodeURIComponent(seed || 'user');
    }
    function formatTime(ts) {
      if (!ts) return '';
      const d = new Date(ts);
      const now = new Date();
      if (d.toDateString() === now.toDateString()) {
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
      }
      return d.toLocaleDateString('fa-IR');
    }
    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s || '';
      return d.innerHTML;
    }
    function playMsgSound() {
      if (!soundEnabled) return;
      try {
        const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdH2Onp2Vi4N6b2lgYWNnd4CIj5COi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5b2phYmRpeH+Jj5GPi4J5');
        audio.volume = 0.3;
        audio.play().catch(()=>{});
      } catch(e) {}
    }
    function channelName(uid1, uid2) {
      return 'chat:' + [uid1, uid2].sort().join('_');
    }
    function isProfileComplete(u) {
      return !!(u && u.username && u.displayName && String(u.username).trim() && String(u.displayName).trim());
    }

    // ===================== AUTH UI (بدون تغییر) =====================
    // ... [کدهای ورود و ثبت‌نام مانند قبل] ...

    // ===================== AFTER LOGIN =====================
    async function afterLogin() {
      try {
        currentUser = await Backendless.UserService.getCurrentUser();
      } catch(e) {
        try {
          currentUser = await Backendless.UserService.login(currentUser.email, null, true);
        } catch(e2) {}
      }
      
      soundEnabled = localStorage.getItem('neo_sound') !== '0';
      
      if (!isProfileComplete(currentUser)) {
        document.getElementById('cpName').value = currentUser.displayName || '';
        document.getElementById('cpUsername').value = currentUser.username || '';
        document.getElementById('cpBio').value = currentUser.bio || '';
        document.getElementById('cpPhone').value = currentUser.phone || '';
        showScreen('completeScreen');
        return;
      }
      
      await initRealtime();
      await loadUsers();
      await loadConversations();
      await ensureGroupExists();
      updateMeBar();
      showScreen('mainScreen');
      renderGroupList();
    }

    // ===================== ENSURE GROUP EXISTS =====================
    async function ensureGroupExists() {
      try {
        // Check if group already exists in users list
        const existing = allUsers.find(u => u.objectId === GROUP_ID);
        if (!existing) {
          // Create a virtual group user
          const groupUser = {
            objectId: GROUP_ID,
            displayName: GROUP_NAME,
            username: 'team_developer',
            avatarSeed: GROUP_ID,
            bio: 'گروه رسمی تیم توسعه دهنده',
            profileComplete: true,
            isGroup: true
          };
          allUsers.push(groupUser);
        }
      } catch(e) {
        console.warn('Group ensure error:', e);
      }
    }

    // ===================== RENDER GROUP LIST =====================
    function renderGroupList() {
      const list = document.getElementById('groupList');
      list.innerHTML = `
        <div class="row" data-group="${GROUP_ID}">
          <div class="avatar-wrap">
            <img class="avatar" src="${GROUP_AVATAR}" alt="گروه" />
            <div class="online-dot" style="background:var(--primary)"></div>
          </div>
          <div class="row-info">
            <div class="row-top">
              <span class="row-name">${GROUP_NAME} <span class="group-badge">گروه</span></span>
            </div>
            <div class="row-bottom">
              <span class="row-preview">${allUsers.length} عضو</span>
            </div>
          </div>
        </div>
      `;
      list.querySelector('.row').onclick = () => {
        const groupPeer = {
          objectId: GROUP_ID,
          displayName: GROUP_NAME,
          username: 'team_developer',
          avatarSeed: GROUP_ID,
          isGroup: true
        };
        openChat(groupPeer);
      };
    }

    // ===================== LOAD USERS (رفع خطا) =====================
    async function loadUsers() {
      try {
        // Fixed: page size cannot exceed 100
        const query = Backendless.DataQueryBuilder.create()
          .setWhereClause("profileComplete = true")
          .setPageSize(100)
          .setOffset(0);
        const users = await Backendless.Data.of(Backendless.User).find(query);
        allUsers = (users || []).filter(u => u.objectId !== currentUser.objectId);
        await ensureGroupExists();
      } catch (e) {
        console.warn('loadUsers error:', e);
        try {
          // Fallback without filter
          const users = await Backendless.Data.of(Backendless.User).find();
          allUsers = (users || []).filter(u => 
            u.objectId !== currentUser.objectId && 
            isProfileComplete(u)
          );
          await ensureGroupExists();
        } catch (e2) {
          allUsers = [];
        }
      }
      renderUserList();
      renderChatList();
      renderGroupList();
    }

    // ===================== LOAD CONVERSATIONS (رفع خطا) =====================
    async function loadConversations() {
      try {
        const uid = currentUser.objectId;
        // Try to get messages from the 'Message' table (singular)
        const query = Backendless.DataQueryBuilder.create()
          .setWhereClause("(senderId = '" + uid + "' or receiverId = '" + uid + "')")
          .setSortBy(['created DESC'])
          .setPageSize(100);
        let messages = [];
        try {
          messages = await Backendless.Data.of('Message').find(query);
        } catch(e) {
          // Fallback: try 'Messages' (plural)
          messages = await Backendless.Data.of('Messages').find(query);
        }
        
        const map = new Map();
        (messages || []).forEach(m => {
          const peerId = m.senderId === uid ? m.receiverId : m.senderId;
          if (peerId && !map.has(peerId)) {
            const preview = m.type === 'voice' ? '🎤 پیام صوتی' : (m.text || 'پیام');
            map.set(peerId, {
              peerId,
              lastMessage: preview,
              lastTime: m.created || Date.now(),
              unread: 0
            });
          }
        });
        conversations = Array.from(map.values());
      } catch (e) {
        console.warn('loadConversations error:', e);
        conversations = [];
      }
      renderChatList();
    }

    // ===================== CHAT FUNCTIONS (رفع خطا) =====================
    async function openChat(peer) {
      currentPeer = peer;
      
      // For group chat, use a special channel
      const isGroup = peer.isGroup || peer.objectId === GROUP_ID;
      
      if (isGroup) {
        document.getElementById('roomAvatar').src = GROUP_AVATAR;
        document.getElementById('roomName').textContent = GROUP_NAME;
        document.getElementById('roomOnline').style.display = 'block';
        document.getElementById('roomStatus').textContent = allUsers.length + ' عضو';
        document.getElementById('roomStatus').classList.remove('off');
      } else {
        const avatarSeed = peer.avatarSeed || peer.username || peer.objectId;
        document.getElementById('roomAvatar').src = avatarUrl(avatarSeed);
        document.getElementById('roomName').textContent = peer.displayName || 'کاربر';
        const on = onlineUsers.has(peer.objectId);
        document.getElementById('roomOnline').style.display = on ? 'block' : 'none';
        document.getElementById('roomStatus').textContent = on ? 'آنلاین' : 'آفلاین';
        document.getElementById('roomStatus').classList.toggle('off', !on);
      }

      // Subscribe to chat channel
      if (activeChatChannel) {
        try { activeChatChannel.unsubscribe(); } catch(e) {}
      }
      
      const chanName = isGroup ? 'group:' + GROUP_ID : channelName(currentUser.objectId, peer.objectId);
      activeChatChannel = ably.channels.get(chanName);
      activeChatChannel.subscribe('message', (msg) => {
        if (msg.data && msg.data.senderId !== currentUser.objectId) {
          appendMessage(msg.data, false);
          if (!mutedChats.has(peer.objectId)) playMsgSound();
        }
      });

      await loadMessages(peer.objectId, isGroup);
      showScreen('chatScreen');
      document.getElementById('mainScreen').classList.add('hide-back');
      document.getElementById('chatScreen').classList.remove('hide');
      
      // Reset input
      document.getElementById('msgInput').value = '';
      document.getElementById('msgInput').style.height = 'auto';
      document.getElementById('btnSend').classList.remove('show');
      document.getElementById('btnMic').style.display = 'flex';
    }

    async function loadMessages(peerId, isGroup) {
      const box = document.getElementById('messages');
      box.innerHTML = '';
      
      try {
        const uid = currentUser.objectId;
        let clause;
        if (isGroup) {
          clause = "receiverId = '" + GROUP_ID + "'";
        } else {
          clause = "((senderId = '" + uid + "' and receiverId = '" + peerId + "') or (senderId = '" + peerId + "' and receiverId = '" + uid + "'))";
        }
        const query = Backendless.DataQueryBuilder.create()
          .setWhereClause(clause)
          .setSortBy(['created ASC'])
          .setPageSize(100);
        let list = [];
        try {
          list = await Backendless.Data.of('Message').find(query);
        } catch(e) {
          list = await Backendless.Data.of('Messages').find(query);
        }
        
        if (!list || !list.length) {
          box.innerHTML = `<div class="empty"><i class="fa-regular fa-comment"></i><div>هنوز پیامی نیست</div></div>`;
          return;
        }
        
        const day = document.createElement('div');
        day.className = 'day';
        const d = new Date(list[0]?.created || Date.now());
        day.textContent = d.toLocaleDateString('fa-IR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        box.appendChild(day);
        
        list.forEach(m => appendMessage(m, m.senderId === uid, true));
        box.scrollTop = box.scrollHeight;
      } catch (e) {
        console.warn('loadMessages error:', e);
        box.innerHTML = '<div class="empty"><div>خطا در بارگذاری پیام‌ها</div></div>';
      }
    }

    async function sendTextMessage(text) {
      if (!text || !currentPeer) return;
      
      const isGroup = currentPeer.isGroup || currentPeer.objectId === GROUP_ID;
      const receiverId = isGroup ? GROUP_ID : currentPeer.objectId;
      
      const payload = {
        senderId: currentUser.objectId,
        receiverId: receiverId,
        text: text,
        type: 'text',
        created: Date.now(),
        senderName: currentUser.displayName
      };
      
      appendMessage(payload, true);

      // Save to Backendless
      try {
        const table = isGroup ? 'GroupMessages' : 'Message';
        await Backendless.Data.of(table).save({
          senderId: payload.senderId,
          receiverId: payload.receiverId,
          text: payload.text,
          type: 'text',
          senderName: payload.senderName
        });
      } catch (e) { console.warn('save msg', e); }

      // Send via Ably
      try {
        if (activeChatChannel) activeChatChannel.publish('message', payload);
        if (!isGroup) {
          const peerInbox = ably.channels.get('inbox:' + currentPeer.objectId);
          peerInbox.publish('message', payload);
        }
      } catch (e) { console.warn('publish', e); }

      // Update local conversation
      let conv = conversations.find(c => c.peerId === receiverId);
      if (!conv) {
        conv = { peerId: receiverId, lastMessage: text, lastTime: Date.now(), unread: 0 };
        conversations.unshift(conv);
      } else {
        conv.lastMessage = text;
        conv.lastTime = Date.now();
      }
      renderChatList();
    }

    // ===================== INIT REALTIME (رفع خطا) =====================
    async function initRealtime() {
      if (ably) {
        try {
          if (presenceChannel) await presenceChannel.presence.leave();
          ably.close();
        } catch(e) {}
        ably = null;
      }
      
      ably = new Ably.Realtime({ 
        key: CONFIG.ABLY_KEY, 
        clientId: currentUser.objectId,
        echoMessages: false 
      });
      
      await new Promise((resolve, reject) => {
        ably.connection.once('connected', resolve);
        ably.connection.once('failed', reject);
        setTimeout(() => resolve(), 5000);
      });

      // Presence channel
      presenceChannel = ably.channels.get('neo-presence');
      
      // Subscribe to presence events with error handling
      try {
        presenceChannel.presence.subscribe('enter', (m) => {
          if (m.clientId && m.clientId !== currentUser.objectId) {
            onlineUsers.add(m.clientId);
            refreshOnlineUI();
          }
        });
        presenceChannel.presence.subscribe('leave', (m) => {
          if (m.clientId) {
            onlineUsers.delete(m.clientId);
            refreshOnlineUI();
          }
        });
        presenceChannel.presence.subscribe('update', (m) => {
          if (m.clientId && m.clientId !== currentUser.objectId) {
            onlineUsers.add(m.clientId);
            refreshOnlineUI();
          }
        });
        
        const members = await presenceChannel.presence.get();
        if (members && typeof members.forEach === 'function') {
          members.forEach(m => {
            if (m.clientId && m.clientId !== currentUser.objectId) {
              onlineUsers.add(m.clientId);
            }
          });
        }
        await presenceChannel.presence.enter({ name: currentUser.displayName });
      } catch(e) {
        console.warn('Presence error:', e);
      }

      // Inbox channel
      try {
        const inbox = ably.channels.get('inbox:' + currentUser.objectId);
        inbox.unsubscribe();
        inbox.subscribe('message', (msg) => {
          if (msg.data) handleIncoming(msg.data);
        });
      } catch(e) { console.warn('inbox subscribe', e); }
      
      refreshOnlineUI();
    }

    function refreshOnlineUI() {
      renderChatList();
      renderUserList();
      if (currentPeer && !currentPeer.isGroup) {
        const on = onlineUsers.has(currentPeer.objectId);
        const dot = document.getElementById('roomOnline');
        const status = document.getElementById('roomStatus');
        if (dot) dot.style.display = on ? 'block' : 'none';
        if (status) {
          status.textContent = on ? 'آنلاین' : 'آفلاین';
          status.classList.toggle('off', !on);
        }
      }
    }

    // ===================== BOOT WITH SPLASH =====================
    (async function boot() {
      // Show splash immediately
      const splash = document.getElementById('splashScreen');
      splash.style.display = 'flex';
      
      // Wait for all scripts to load (already loaded via CDN)
      // Give a moment for SDKs to initialize
      await new Promise(resolve => setTimeout(resolve, 800));
      
      setLoading(true);
      try {
        const valid = await Backendless.UserService.isValidLogin();
        if (valid) {
          currentUser = await Backendless.UserService.getCurrentUser();
          if (currentUser) {
            await afterLogin();
            splash.style.display = 'none';
            setLoading(false);
            return;
          }
        }
      } catch (e) {
        console.warn('Boot auth check:', e);
      }
      
      splash.style.display = 'none';
      setLoading(false);
      showScreen('authScreen');
    })();

    // ===================== TAB HANDLING WITH GROUPS =====================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const tabName = tab.dataset.tab;
        document.getElementById('chatList').style.display = tabName === 'chats' ? 'block' : 'none';
        document.getElementById('userList').style.display = tabName === 'users' ? 'block' : 'none';
        document.getElementById('groupList').style.display = tabName === 'groups' ? 'block' : 'none';
        if (tabName === 'chats') renderChatList();
        else if (tabName === 'users') renderUserList();
        else if (tabName === 'groups') renderGroupList();
      };
    });
